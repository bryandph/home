id = "pi"
version = "2026.10.1.900"
min_engine_version = 1
updated_at = "2026-10-01T00:00:00Z"
aliases = ["herdr:pi"]

[[rules]]
id = "working_literal"
state = "working"
priority = 100
region = "whole_recent"
visible_working = true
any = [
  { contains = ["Working..."] },
  { line_regex = ['^[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏] Working$'] },
]

[[rules]]
id = "working_border"
state = "working"
priority = 100
region = "bottom_non_empty_lines(12)"
visible_working = true
any = [
  { line_regex = ['^── [⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏] Working ─+$'] },
  { line_regex = ['^[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏] Working$'] },
]

# Local addition: Pi's project-trust dialog is a visible blocker
# (remote manifest 2026.10.01.1 has no blocked rule). Retire when upstream ships one.
[[rules]]
id = "trust_project_dialog"
state = "blocked"
priority = 980
region = "bottom_non_empty_lines(20)"
visible_blocker = true
contains = ["Trust project folder?", "enter select"]
any = [
  { contains = ["Do not trust"] },
  { contains = ["Trust (this session only)"] },
]
